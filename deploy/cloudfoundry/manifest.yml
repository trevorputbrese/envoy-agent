---
# Envoy Agent on Tanzu Platform for Cloud Foundry, staged by the Envoy buildpack.
# Push from the repository root with the foundation's vars file:
#   cf push -f deploy/cloudfoundry/manifest.yml --vars-file deploy/cloudfoundry/vars/techbrese.yml
# Envoy finds its bindings by what they carry, not their names: a chat model, a login
# (user-provided: username + password_hash) and, optionally, a volume for its home folder.
# The login never goes here or in `cf set-env`: `cf push` prints app environment variables.
applications:
  - name: envoy-agent
    path: ../..
    buildpacks: [envoy_buildpack]
    stack: cflinuxfs4
    memory: 2G
    disk_quota: 4G
    instances: 1
    timeout: 180
    health-check-type: http
    health-check-http-endpoint: /api/health
    routes:
      - route: ((route))
    services: ((services))
